    <meta name="theme-color" content="#17222d" />
    <script>
      // Applies the stored appearance (auto/light/dark) before the first paint, so nothing flashes.
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#17222d" : "#ffffff");
      } catch (e) {}
      // iOS 27 beta blurs the top edge of installed PWAs (the first ~16 px below the status bar). For the installed
      // iOS app the stylesheet reserves a tinted strip there (#status-bar-tint) and moves the page down by it.
      var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      var standalone = navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
      if (ios) document.documentElement.classList.add("is-ios");
      if (ios && standalone) document.documentElement.classList.add("is-standalone");
    </script>
